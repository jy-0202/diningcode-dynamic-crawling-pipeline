name: DiningCode Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45

    steps:
      # -------------------------------------------------------
      # 1. GitHub Repository Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Self-hosted Runner Python 확인
      # -------------------------------------------------------

      - name: Check Python
        shell: cmd
        run: |
          python --version
          where python

      # -------------------------------------------------------
      # 3. 가상환경 생성 및 Dependency 설치
      # -------------------------------------------------------

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      # -------------------------------------------------------
      # 4. DiningCode Crawling / Extract / Preprocess 실행
      # -------------------------------------------------------

      - name: Run Crawling Extract Preprocess
        shell: cmd
        run: |
          .venv\Scripts\python.exe -c "from src.diningcode_pipeline import run_crawling, run_extract, run_preprocess; raw_batch_dir = run_crawling(); interim_csv_file, restaurant_list = run_extract(raw_batch_dir); processed_csv_file = run_preprocess(interim_csv_file, restaurant_list); print('GitHub Actions Pipeline 완료'); print(f'Raw: {raw_batch_dir}'); print(f'Interim: {interim_csv_file}'); print(f'Processed: {processed_csv_file}')"

      # -------------------------------------------------------
      # 5. Raw / Interim / Processed 결과 저장
      # -------------------------------------------------------

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diningcode-pipeline-data
          path: |
            data/raw/html/
            data/interim/
            data/processed/
          if-no-files-found: warn
          retention-days: 7