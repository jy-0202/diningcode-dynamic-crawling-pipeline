name: DiningCode Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Crawling Extract Preprocess
        shell: powershell
        run: |
          @'
          from src.diningcode_pipeline import run_crawling, run_extract, run_preprocess

          raw_batch_dir = run_crawling()
          interim_csv_file, restaurant_list = run_extract(raw_batch_dir)
          processed_csv_file = run_preprocess(interim_csv_file, restaurant_list)

          print()
          print('GitHub Actions Pipeline 완료')
          print(f'Raw: {raw_batch_dir}')
          print(f'Interim: {interim_csv_file}')
          print(f'Processed: {processed_csv_file}')
          '@ | python -

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diningcode-pipeline-data
          path: |
            data/raw/html/
            data/interim/
            data/processed/
          if-no-files-found: warn
          retention-days: 7