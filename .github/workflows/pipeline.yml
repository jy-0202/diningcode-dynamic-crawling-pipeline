name: DiningCode Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45

    env:
      HEADLESS: 'false'
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # -------------------------------------------------------
      # 1. GitHub Repository Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Self-hosted Runner Python 확인
      # -------------------------------------------------------

      - name: Check Python
        shell: cmd
        run: |
          python --version
          where python

      # -------------------------------------------------------
      # 3. 가상환경 생성 및 Dependency 설치
      # -------------------------------------------------------

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      # -------------------------------------------------------
      # 4. MySQL 연결 가능 여부 확인
      # -------------------------------------------------------

      - name: Check MySQL connection
        shell: cmd
        run: |
          .venv\Scripts\python.exe -c "import os, socket; conn = socket.create_connection((os.environ['DB_HOST'], int(os.environ['DB_PORT'])), timeout=5); conn.close(); print('MySQL port connection OK')"

      # -------------------------------------------------------
      # 5. DiningCode 전체 파이프라인 실행
      # -------------------------------------------------------

      - name: Run DiningCode pipeline
        shell: cmd
        run: |
          chcp 65001 > nul
          set "PYTHONUTF8=1"
          .venv\Scripts\python.exe -c "from main import main; main()"

      # -------------------------------------------------------
      # 6. Raw / Interim / Processed 결과 저장
      # -------------------------------------------------------

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diningcode-pipeline-data
          path: |
            data/raw/html/
            data/interim/
            data/processed/
          if-no-files-found: warn
          retention-days: 7