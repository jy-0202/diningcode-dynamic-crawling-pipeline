name: CD

# ===========================================================
# 1. 실행 조건
# ===========================================================

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

# ===========================================================
# 2. GitHub Actions 권한
# ===========================================================

permissions:
  contents: read
  id-token: write

# ===========================================================
# 3. GCE Deploy Job
# ===========================================================

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Repository Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # -------------------------------------------------------
      # 2. Google Cloud 인증
      # -------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # -------------------------------------------------------
      # 3. Google Cloud CLI 설정
      # -------------------------------------------------------

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # -------------------------------------------------------
      # 4. OS Login 임시 SSH Key 등록
      # -------------------------------------------------------

      - name: Configure OS Login SSH key
        run: |
          mkdir -p "$HOME/.ssh"

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f "$HOME/.ssh/gce_cd_key"

          gcloud compute os-login ssh-keys add \
            --key-file="$HOME/.ssh/gce_cd_key.pub" \
            --ttl=10m \
            --project="${{ vars.GCP_PROJECT_ID }}"

      # -------------------------------------------------------
      # 5. GCE에 CI 검증 Commit 배포
      # -------------------------------------------------------

      - name: Deploy to GCE
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Deploy SHA: $DEPLOY_SHA"

          gcloud compute ssh "${{ vars.GCE_INSTANCE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCE_ZONE }}" \
            --tunnel-through-iap \
            --ssh-key-file="$HOME/.ssh/gce_cd_key" \
            --command="
              set -e

              APP_DIR=\"\$HOME/diningcode-dynamic-crawling-pipeline\"
              DEPLOY_SHA=\"$DEPLOY_SHA\"

              if [ -d \"\$APP_DIR/.git\" ]; then
                echo \"기존 저장소 업데이트\"
                git -C \"\$APP_DIR\" fetch origin main
              else
                echo \"저장소 최초 Clone\"
                git clone https://github.com/jy-0202/diningcode-dynamic-crawling-pipeline.git \"\$APP_DIR\"
                git -C \"\$APP_DIR\" fetch origin main
              fi

              git -C \"\$APP_DIR\" reset --hard \"\$DEPLOY_SHA\"

              cd \"\$APP_DIR\"

              if [ ! -d \".venv\" ]; then
                python3 -m venv .venv
              fi

              .venv/bin/python -m pip install --upgrade pip
              .venv/bin/python -m pip install -r requirements.txt

              echo \"배포된 Commit:\"
              git rev-parse --short HEAD

              echo \"Python:\"
              .venv/bin/python --version

              echo \"GCE CD 배포 완료\"
            " \
            --quiet